# K3Day for lazygit, part of cosmic-k3day-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/k3day.yml and
# zsh/k3day.zsh sets LG_CONFIG_FILE to "config.yml,k3day.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/k3day.yml"
gui:
  theme:
    activeBorderColor:
      - "#586065"
      - bold
    inactiveBorderColor:
      - "#CED0D0"
    searchingActiveBorderColor:
      - "#A04412"
      - bold
    optionsTextColor:
      - "#5B5D5D"
    selectedLineBgColor:
      - "#DADCDC"
    inactiveViewSelectedLineBgColor:
      - "#F0F2F2"
    cherryPickedCommitFgColor:
      - "#E5E6E6"
    cherryPickedCommitBgColor:
      - "#666052"
    markedBaseCommitFgColor:
      - "#E5E6E6"
    markedBaseCommitBgColor:
      - "#5E5E5E"
    unstagedChangesColor:
      - "#B03316"
    defaultFgColor:
      - "#1A1B1B"
  authorColors:
    "*": "#666052"
