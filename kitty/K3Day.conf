# K3Day for kitty, part of cosmic-k3day-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/K3Day.conf

foreground              #1A1B1B
background              #E5E6E6
selection_foreground    none
selection_background    #CED0D0

cursor                  #586065
cursor_text_color       #E5E6E6

url_color               #666052
url_style               curly

active_border_color     #586065
inactive_border_color   #CED0D0
bell_border_color       #A04412

active_tab_foreground   #E5E6E6
active_tab_background   #586065
inactive_tab_foreground #5B5D5D
