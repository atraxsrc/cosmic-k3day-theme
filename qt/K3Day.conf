# K3Day colour scheme for qt5ct / qt6ct, part of cosmic-k3day-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> K3Day, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1a1b1b, #f0f2f2, #f0f2f2, #ced0d0, #dadcdc, #dadcdc, #1a1b1b, #0d0e0e, #1a1b1b, #f0f2f2, #e5e6e6, #dadcdc, #586065, #e5e6e6, #586065, #586065, #f0f2f2, #e5e6e6, #f0f2f2, #1a1b1b, #616161
disabled_colors=#939494, #f0f2f2, #f0f2f2, #ced0d0, #dadcdc, #dadcdc, #939494, #5b5d5d, #939494, #e5e6e6, #e5e6e6, #dadcdc, #ced0d0, #5b5d5d, #616161, #616161, #f0f2f2, #e5e6e6, #f0f2f2, #1a1b1b, #ced0d0
inactive_colors=#1a1b1b, #f0f2f2, #f0f2f2, #ced0d0, #dadcdc, #dadcdc, #1a1b1b, #0d0e0e, #1a1b1b, #f0f2f2, #e5e6e6, #dadcdc, #586065, #e5e6e6, #586065, #586065, #f0f2f2, #e5e6e6, #f0f2f2, #1a1b1b, #616161
