"$schema" = "https://starship.rs/config-schema.json"
# K3Day starship prompt, part of cosmic-k3day-theme (MIT).
# Close to the defaults, coloured from the palette: secondary-text directory,
# branch in the yellow slot, the warning colour for a dirty tree, a success
# prompt character (the error colour after a failed command), HH:MM clock on
# the right. Modules without a style here keep their defaults, which use the
# ANSI slots the COSMIC Terminal scheme already colours.

format = "$all"
right_format = "$time"
palette = "k3day"

[palettes.k3day]
accent = "#586065"
warning = "#A04412"
success = "#5E5E5E"
error = "#B03316"
third = "#666052"
secondary = "#5B5D5D"
faint = "#616161"
dim = "#939494"
fg = "#1A1B1B"

[character]
success_symbol = "[❯](bold success)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold third)"

[directory]
style = "bold secondary"
read_only_style = "error"
repo_root_style = "bold third"

[git_branch]
style = "bold third"

[git_commit]
style = "bold third"

[git_state]
style = "bold warning"

[git_status]
style = "warning"

[git_metrics]
added_style = "success"
deleted_style = "error"

[username]
style_user = "success"
style_root = "bold error"

[hostname]
style = "success"

[cmd_duration]
style = "faint"

[status]
style = "bold error"

[sudo]
style = "bold warning"

[jobs]
style = "warning"

[dart]
disabled = true

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style)"
style = "dim"
